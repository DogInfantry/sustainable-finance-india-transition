name: Deploy to Vercel
on:
  push:
    branches: [dashboard]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_4pgfqRkIU2W9etJoOiEwg250
          vercel-project-name: sfin-dashboard
          working-directory: ./
          vercel-args: '--prod'
